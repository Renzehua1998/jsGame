<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Linux Kernel Study logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2129"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d0d7de"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- mini red-black tree (kernel algorithms) -->
  <g stroke="#484f58" stroke-width="1.5">
    <line x1="50" y1="17" x2="43.5" y2="27"/>
    <line x1="50" y1="17" x2="56.5" y2="27"/>
  </g>
  <circle cx="50" cy="17" r="4" fill="#58a6ff"/>
  <circle cx="43.5" cy="27" r="3.2" fill="#f85149"/>
  <circle cx="56.5" cy="27" r="3.2" fill="#2d333b" stroke="#6e7681" stroke-width="1.2"/>

  <!-- simplified Tux (body + belly + wings) -->
  <ellipse cx="24" cy="31" rx="12" ry="14.5" fill="#010409"/>
  <ellipse cx="24" cy="34.5" rx="7.5" ry="10" fill="url(#belly)"/>
  <ellipse cx="12.5" cy="32" rx="2.6" ry="6" transform="rotate(18 12.5 32)" fill="#010409"/>
  <ellipse cx="35.5" cy="32" rx="2.6" ry="6" transform="rotate(-18 35.5 32)" fill="#010409"/>
  <!-- eyes + beak -->
  <circle cx="20.6" cy="25" r="1.7" fill="#0d1117"/>
  <circle cx="27.4" cy="25" r="1.7" fill="#0d1117"/>
  <circle cx="21.2" cy="24.4" r="0.55" fill="#ffffff"/>
  <circle cx="28" cy="24.4" r="0.55" fill="#ffffff"/>
  <path d="M20.8 28.4 L27.2 28.4 L24 32.2 Z" fill="#f0883e"/>
  <!-- feet -->
  <ellipse cx="19.5" cy="46" rx="3.4" ry="1.7" fill="#f0883e"/>
  <ellipse cx="28.5" cy="46" rx="3.4" ry="1.7" fill="#f0883e"/>

  <!-- step-player timeline (replay & step through algorithms) -->
  <rect x="12" y="52" width="30" height="4" rx="2" fill="#30363d"/>
  <rect x="12" y="52" width="18" height="4" rx="2" fill="#58a6ff"/>
  <circle cx="30" cy="54" r="3" fill="#e6edf3" stroke="#0d1117" stroke-width="1.2"/>
  <!-- play button -->
  <path d="M48.5 46.5 L57.5 52 L48.5 57.5 Z" fill="#3fb950"/>
</svg>
