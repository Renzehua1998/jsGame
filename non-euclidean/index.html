  for (let depth = 0; depth < 6 && all.length < 900; depth++) {
    const next = [];
    for (const [a, b] of edges) {
      for (let j = 0; j < 3; j++) {
        const na = reflectPt(a, ROOM_NORMALS[j]), nb = reflectPt(b, ROOM_NORMALS[j]);
        const k = ekey(na, nb);
        if (!seen.has(k)) { seen.add(k); next.push([na, nb]); all.push([na, nb]); }
      }
    }
    edges = next;
  }
  /* 返回世界 4D 折线（每段棱采样 6 点），绘制时再变换到相机坐标系投影 */
  const polys = [];
  for (const [a, b] of all) {
    const poly = [a];
    for (let i = 1; i <= 6; i++) poly.push(geoLerp(a, b, i / 6));
    polys.push(poly);
  }
  return polys;
}

/* ---------------- H³ 蜂巢骨架（圆盘上的 {5,3,4} 棱） ----------------
   基本域四面体 O-F-E-V 中，墙 n4=0 上的棱 E–V 正是正十二面体的棱；
   在 4 面镜面反射群下取轨道即得蜂巢 1-骨架，再投影到圆盘（庞加莱/克莱因）。 */
function eta4(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2] - a[3] * b[3];
}
function solve3(A, b) {
  const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
                   - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
                   + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det(A);
  if (Math.abs(D) < 1e-14) return null;
  const col = (c) => A.map((row, r) => row.map((v, j) => (j === c ? b[r] : v)));
  return [det(col(0)) / D, det(col(1)) / D, det(col(2)) / D];
}
/* 与 3 个镜面正交的基本域顶点（η 度量，⟨x,x⟩=−1，w>0） */
function hyperVertex(ia, ib, ic) {
  const n = HYPER_NORMALS, cons = [ia, ib, ic];
  const free = [0, 1, 2, 3].find((i) => !cons.includes(i));
  const js = [0, 1, 2, 3].filter((j) => j !== free);
  const A = cons.map((ci) => js.map((j) => eta4(n[ci], n[j])));
  const b = cons.map((ci) => -eta4(n[ci], n[free]));
  const t = solve3(A, b);
  if (!t) return null;
  const tt = [0, 0, 0, 0]; tt[free] = 1;
  js.forEach((j, c) => { tt[j] = t[c]; });
  const x = [0, 0, 0, 0];
  for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) x[i] += tt[k] * n[k][i];
  const s = Math.sqrt(-1 / eta4(x, x));
  for (let i = 0; i < 4; i++) x[i] *= s;
  if (x[3] < 0) for (let i = 0; i < 4; i++) x[i] = -x[i];
  return x;
}
/* H³ 胞腔编号：基本域胞腔中心 O 在反射群下的轨道；
   按 BFS 发现顺序给每个胞腔一个稳定编号（世界坐标），绘制时随相机投影。 */
let hyperCellLabels = null;
function buildHyperCellLabels() {
  const O = hyperVertex(0, 1, 2);          // 正交于 n1,n2,n3 → 胞腔中心
  const ekey = (p) => p.map((x) => x.toFixed(2)).join(",");
  const seen = new Set([ekey(O)]);
  let layer = [O];
  const all = [O];
  for (let depth = 0; depth < 4 && all.length < 150; depth++) {
    const next = [];
    for (const c of layer) {
      for (let j = 0; j < 4; j++) {
        const r = reflectPt(c, HYPER_NORMALS[j]);
        const k = ekey(r);
        if (!seen.has(k)) { seen.add(k); next.push(r); all.push(r); }
      }
    }
    layer = next;
  }
  return all.map((c, i) => ({ c, i }));
}

let hyperTilingPolys = null;
function buildHyperTiling() {
  const E = hyperVertex(0, 2, 3);   // 正交于 n1,n3,n4
  const V = hyperVertex(1, 2, 3);   // 正交于 n2,n3,n4
  const ekey = (a, b) =>
    [a, b].map((v) => v.map((x) => x.toFixed(3)).join(",")).sort().join("|");
  const seen = new Set([ekey(E, V)]);
  let edges = [[E, V]];
  const all = [[E, V]];
  for (let depth = 0; depth < 8 && all.length < 900; depth++) {
    const next = [];
    for (const [a, b] of edges) {
      for (let j = 0; j < 4; j++) {
        const na = reflectPt(a, HYPER_NORMALS[j]), nb = reflectPt(b, HYPER_NORMALS[j]);
        const k = ekey(na, nb);
        if (!seen.has(k)) { seen.add(k); next.push([na, nb]); all.push([na, nb]); }
      }
    }
    edges = next;
  }
  const polys = [];
  for (const [a, b] of all) {
    const poly = [a];
    for (let i = 1; i <= 5; i++) poly.push(geoLerp(a, b, i / 5));
    polys.push(poly);
  }
  return polys;
}

/* ---------------- S³ 蜂巢骨架（圆盘上的 {4,3,3} 超立方体棱） ----------------
   {4,3,3} 蜂巢即四维超立方体的边界：16 个顶点 (±½,±½,±½,±½)，
   32 条棱连接「恰有一个坐标符号不同」的相邻顶点。每条棱是 S³ 上的测地弧，
   立体投影到圆盘后连线，给出胞腔结构。 */
let sphereTilingPolys = null;
function buildSphereTiling() {
  const V = [];
  for (let m = 0; m < 16; m++) {
    const v = [];
    for (let i = 0; i < 4; i++) v.push(((m >> i) & 1) ? 0.5 : -0.5);
    V.push(v);
  }
  const polys = [];
  for (let a = 0; a < 16; a++) {
    for (let b = a + 1; b < 16; b++) {
      let diff = 0;
      for (let i = 0; i < 4; i++) if (((a >> i) & 1) !== ((b >> i) & 1)) diff++;
      if (diff !== 1) continue;
      const A = V[a], B = V[b];
      const d = Math.acos(Math.max(-1, Math.min(1,
        A[0] * B[0] + A[1] * B[1] + A[2] * B[2] + A[3] * B[3])));
      const sd = Math.sin(d);
      const poly = [A];
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        let P;
        if (sd < 1e-9) P = A;
        else {
          const u = Math.sin((1 - t) * d) / sd, w = Math.sin(t * d) / sd;
          P = [u * A[0] + w * B[0], u * A[1] + w * B[1],
               u * A[2] + w * B[2], u * A[3] + w * B[3]];
        }
        poly.push(P);
      }
      polys.push(poly);
    }
  }
  return polys;
}

/* 把世界坐标点变换到相机坐标系 x'=(e1·x, e2·x, e3·x, p·x)。
   相机基点 p→(0,0,0,1)、朝向 e_i→标准基；于是 S³ 地图始终以相机所在
   胞腔为中心并随视角旋转（“随相机旋转保持居中”）。 */
function s3ToCam(v) {
  const c = cam;
  return [
    c[0] * v[0] + c[1] * v[1] + c[2] * v[2] + c[3] * v[3],
    c[4] * v[0] + c[5] * v[1] + c[6] * v[2] + c[7] * v[3],
    c[8] * v[0] + c[9] * v[1] + c[10] * v[2] + c[11] * v[3],
    c[12] * v[0] + c[13] * v[1] + c[14] * v[2] + c[15] * v[3],
  ];
}
/* 把世界 4D 折线骨架变换到相机坐标系并投影后用 2D 画布描边。
   opts.bands：按线段中点到中心（相机）的半径分带淡化（越远越淡）。
   opts.viewFade：按线段方向与视线（相机坐标系下地图“上方”＝正前方）的
   夹角高亮——越接近正前方越亮。逐段 alpha 量化到 6 档后分档描边。 */
function strokeTiling(polys, cx, cy, R, opts) {
  opts = opts || {};
  const bands = opts.bands || [{ r0: 0, r1: 2, a: 1 }];
  const bandA = (r) => { for (const b of bands) if (r >= b.r0 && r < b.r1) return b.a; return 0; };
  const proj = [];
  for (const poly of polys) {
    const pp = [];
    for (const P of poly) {
      const u = mapProjectOf(P);
      pp.push(u ? [u[0], u[1], Math.hypot(u[0], u[1])] : null);
    }
    proj.push(pp);
  }
  const LEVELS = 6;
  const buckets = [];
  for (let i = 0; i < LEVELS; i++) buckets.push([]);
  for (const pp of proj) {
    let prev = null;
    for (const q of pp) {
      if (!q) { prev = null; continue; }
      if (prev && prev[2] <= 1.05 && q[2] <= 1.05) {
        const midR = (prev[2] + q[2]) * 0.5;
        let a = bandA(midR);
        if (opts.viewFade) {
          const align = midR > 1e-6 ? -(prev[1] + q[1]) * 0.5 / midR : 0;
          a = Math.min(1, a * (0.5 + 1.1 * Math.max(0, align)));
        }
        if (a > 0.001) {
          const lvl = Math.min(LEVELS - 1, Math.floor(a * LEVELS));
          buckets[lvl].push([cx + prev[0] * R, cy + prev[1] * R, cx + q[0] * R, cy + q[1] * R]);
        }
      }
      prev = q;
    }
  }
  for (let lvl = 0; lvl < LEVELS; lvl++) {
    if (!buckets[lvl].length) continue;
    mctx.globalAlpha = (lvl + 0.5) / LEVELS;
    mctx.beginPath();
    for (const s of buckets[lvl]) { mctx.moveTo(s[0], s[1]); mctx.lineTo(s[2], s[3]); }
    mctx.stroke();
  }
  mctx.globalAlpha = 1;
}
/* H³ 骨架按离相机半径分带淡化 */
const MAP_FADE_BANDS = [
  { r0: 0.00, r1: 0.30, a: 0.55 },
  { r0: 0.30, r1: 0.55, a: 0.40 },
  { r0: 0.55, r1: 0.75, a: 0.26 },
  { r0: 0.75, r1: 1.00, a: 0.14 },
  { r0: 1.00, r1: 2.00, a: 0.07 },
];

function recordTrail() {
  if (spaceMode === SPACE.EUCLID) return;
  const p4 = [cam[12], cam[13], cam[14], cam[15]];   // 存世界 4D 点，绘制时再投影
  const lastP = trail[trail.length - 1];
  let far = !lastP;
  if (lastP) {
    let d2 = 0;
    for (let i = 0; i < 4; i++) d2 += (p4[i] - lastP[i]) * (p4[i] - lastP[i]);
    far = d2 > 0.012 * 0.012;
  }
  if (far) { trail.push(p4); if (trail.length > 800) trail.shift(); }
}

function drawMinimap() {
  const w = mapCanvas.width, h = mapCanvas.height;
  const cx = w / 2 + mapPan[0], cy = h / 2 + mapPan[1];
  const R = (Math.min(w, h) / 2 - 12) * mapZoom;
  mctx.clearRect(0, 0, w, h);
  mctx.fillStyle = "rgba(200,220,255,0.85)";
  mctx.font = "11px Consolas, monospace";
  mctx.fillText(
    spaceMode === SPACE.SPHERE ? "S³ 立体投影"
      : spaceMode === SPACE.HYPER ? (hyperMapMode === 0 ? "庞加莱圆盘" : "克莱因圆盘")
      : spaceMode === SPACE.ROOMS ? "展开图 {4,5}"
      : "地图（占位）", 10, 16);
  /* 内圈标记双曲距离 d=1：庞加莱 r=tanh(1/2)，克莱因 r=tanh(1) */
  const inner = (spaceMode === SPACE.HYPER && hyperMapMode === 1)
    ? Math.tanh(1) : Math.tanh(0.5);
  mctx.strokeStyle = "rgba(140,190,255,0.25)";
  mctx.beginPath(); mctx.arc(cx, cy, R * inner, 0, Math.PI * 2); mctx.stroke();
  mctx.strokeStyle = "rgba(140,190,255,0.7)";
  mctx.beginPath(); mctx.arc(cx, cy, R, 0, Math.PI * 2); mctx.stroke();
  mctx.beginPath(); mctx.moveTo(cx - 6, cy); mctx.lineTo(cx + 6, cy);
  mctx.moveTo(cx, cy - 6); mctx.lineTo(cx, cy + 6); mctx.stroke();

  if (spaceMode === SPACE.EUCLID) {
    mctx.fillStyle = "#ff5555";
    mctx.beginPath(); mctx.arc(cx, cy, 4, 0, Math.PI * 2); mctx.fill();
    return;
  }
  /* 蜂巢骨架：每帧变换到相机坐标系后重绘（地图随相机重定心/旋转） */
  if (spaceMode === SPACE.SPHERE) {
    if (!sphereTilingPolys) sphereTilingPolys = buildSphereTiling();
    mctx.strokeStyle = "rgba(130,180,240,0.45)";
    mctx.lineWidth = 1;
    strokeTiling(sphereTilingPolys, cx, cy, R);
  } else if (spaceMode === SPACE.HYPER) {
    if (!hyperTilingPolys) hyperTilingPolys = buildHyperTiling();
    mctx.strokeStyle = "rgba(150,200,255,1.0)";   // 透明度由分带 + 视线高亮控制
    mctx.lineWidth = 1;
    strokeTiling(hyperTilingPolys, cx, cy, R, { bands: MAP_FADE_BANDS, viewFade: true });
    /* 胞腔编号（只标注近处，避免拥挤） */
    if (cellLabelOn) {
      if (!hyperCellLabels) hyperCellLabels = buildHyperCellLabels();
      mctx.fillStyle = "rgba(205,225,255,0.92)";
      mctx.font = "9px Consolas, monospace";
      mctx.textAlign = "center";
      mctx.textBaseline = "middle";
      for (const lab of hyperCellLabels) {
        const lu = mapProjectOf(lab.c);
        if (!lu || Math.hypot(lu[0], lu[1]) > 0.72) continue;
        mctx.fillText(String(lab.i), cx + lu[0] * R, cy + lu[1] * R);
      }
      mctx.textAlign = "start";
      mctx.textBaseline = "alphabetic";
    }
  } else if (spaceMode === SPACE.ROOMS) {
    if (!roomTilingPolys) roomTilingPolys = buildRoomTiling();
    mctx.strokeStyle = "rgba(130,180,240,0.4)";
    mctx.lineWidth = 1;
    strokeTiling(roomTilingPolys, cx, cy, R);
  }
  if (trail.length > 1) {
    mctx.strokeStyle = "rgba(255,120,120,0.55)";
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    let started = false;
    for (let i = 0; i < trail.length; i++) {
      const uu = mapProjectOf(trail[i]);
      if (!uu) continue;
      const tx = cx + uu[0] * R, ty = cy + uu[1] * R;
      if (!started) { mctx.moveTo(tx, ty); started = true; } else mctx.lineTo(tx, ty);
    }
    mctx.stroke();
    mctx.lineWidth = 1;
  }
  const u = mapProject();
  if (!u) return;
  let ux = u[0], uy = u[1];
  const r = Math.hypot(ux, uy);
  if (r > 0.995) { ux *= 0.995 / r; uy *= 0.995 / r; }
  const hdir = mapHeading(u) || [0, 0];
  let hx = hdir[0], hy = hdir[1];
  const dotX = cx + ux * R, dotY = cy + uy * R;
  mctx.strokeStyle = "#ffd0d0";
  mctx.beginPath(); mctx.moveTo(dotX, dotY);
  mctx.lineTo(dotX + hx * 12, dotY + hy * 12); mctx.stroke();
  mctx.fillStyle = "#ff5555";
  mctx.beginPath(); mctx.arc(dotX, dotY, 4, 0, Math.PI * 2); mctx.fill();
}

/* ---------------- 自检模式（自动化验收）---------------- */
const isSelfTest = new URLSearchParams(location.search).has("selftest");
let stFrames = 0;

function runSelfTest() {
  const checks = [];
  const add = (name, ok, info) => checks.push({ name, ok, info: info || "" });

  add("无致命错误", !fatalShown);
  add("HUD已更新", hudEl.textContent.indexOf("FPS") >= 0);

  const px = (x, y) => {
    const b = new Uint8Array(4);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    return [b[0], b[1], b[2]];
  };

  const col = (j) => [cam[4 * j], cam[4 * j + 1], cam[4 * j + 2], cam[4 * j + 3]];
  const dot4 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  const colDiff = (a, b) =>
    Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]), Math.abs(a[2] - b[2]));

  /* ---- Phase 4：交互接线（与空间无关） ---- */
  add("提示浮字元素存在", !!document.getElementById("toast"));
  advanceCamera(1, 0, 0, 0.5);
  dispatchEvent(new KeyboardEvent("keydown", { code: "KeyR" }));
  dispatchEvent(new KeyboardEvent("keyup", { code: "KeyR" }));
  const init = CAM_INIT[spaceMode];
  let rOk = true;
  for (let i = 0; i < 16; i++) if (Math.abs(cam[i] - init[i]) > 1e-9) rOk = false;
  add("R键重置相机", rOk);
  const a0 = autoRes;
  dispatchEvent(new KeyboardEvent("keydown", { code: "Digit0" }));
  dispatchEvent(new KeyboardEvent("keyup", { code: "Digit0" }));
  const a1 = autoRes;
  dispatchEvent(new KeyboardEvent("keydown", { code: "Digit0" }));
  dispatchEvent(new KeyboardEvent("keyup", { code: "Digit0" }));
  add("0键切换自动分辨率", a1 !== a0 && autoRes === a0);

  /* ---- Phase 5：步行模式（重力约束） ---- */
  dispatchEvent(new KeyboardEvent("keydown", { code: "KeyG" }));
  dispatchEvent(new KeyboardEvent("keyup", { code: "KeyG" }));
  add("G进入步行模式", walkMode);
  for (let i = 0; i < 80; i++) gravityStep();
  const hd = heightAlongUp();
  add("重力稳定于眼高", Math.abs(hd - walkH) < 0.05,
      "d=" + hd.toFixed(3) + " 目标" + walkH);
  const pb = [cam[12], cam[13], cam[14], cam[15]];
  for (let i = 0; i < 20; i++) { walkMove(1, 0, 0.08); gravityStep(); }
  const moved4 = Math.hypot(cam[12] - pb[0], cam[13] - pb[1], cam[14] - pb[2], cam[15] - pb[3]);
  add("步行产生位移", moved4 > 0.2, "Δ=" + moved4.toFixed(3));
  const hd2 = heightAlongUp();
  add("步行中保持眼高", Math.abs(hd2 - walkH) < 0.05, "d=" + hd2.toFixed(3));
  dispatchEvent(new KeyboardEvent("keydown", { code: "KeyG" }));
  dispatchEvent(new KeyboardEvent("keyup", { code: "KeyG" }));
  add("G退出步行模式", !walkMode);
  camReset();

  if (spaceMode === SPACE.EUCLID) {
    const orthoOk = () => {
      const e1 = col(0), e2 = col(1), e3 = col(2);
      return Math.abs(dot4(e1, e1) - 1) < 1e-9 && Math.abs(dot4(e2, e2) - 1) < 1e-9 &&
             Math.abs(dot4(e3, e3) - 1) < 1e-9 &&
             Math.abs(dot4(e1, e2)) < 1e-9 && Math.abs(dot4(e1, e3)) < 1e-9 &&
             Math.abs(dot4(e2, e3)) < 1e-9;
    };
    add("相机框架正交(初始)", orthoOk());
    const p0 = [cam[12], cam[13], cam[14]];
    rotateCols(0, 2, 0.7); rotateCols(1, 2, -0.3); rotateCols(0, 1, 0.5);
    advanceCamera(1, 0, 0, 1.5);
    const moved = Math.hypot(cam[12] - p0[0], cam[13] - p0[1], cam[14] - p0[2]);
    add("相机框架正交(旋转后)", orthoOk());
    add("欧氏移动距离正确", Math.abs(moved - 1.5) < 1e-9, "moved=" + moved);

    /* 几何：相机(0,0,0)朝-z；球心(0,0,-2) r=0.9 → 中心命中距1.1；地面 y=-1。
       无限点阵下不存在保证为天空的像素，天空用 uDebug=3 纯天空模式验证 */
    camReset();
    gl.uniform1i(U.debug, 3);
    draw(performance.now() / 1000);
    const s = px(canvas.width >> 1, Math.floor(canvas.height * 0.9));
    const s2 = px(canvas.width >> 1, Math.floor(canvas.height * 0.1));
    add("天空偏蓝(uDebug=3)", s[2] > s[0] + 20, JSON.stringify(s));
    add("天空渐变(上亮下暗)", s[0] + s[1] + s[2] > s2[0] + s2[1] + s2[2] + 60,
        "top=" + s + " bottom=" + s2);

    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const c = px(canvas.width >> 1, canvas.height >> 1);
    add("中心命中球体(橙)", c[0] > 90 && c[0] > c[2] + 40, JSON.stringify(c));
    const f = px(canvas.width >> 1, Math.floor(canvas.height * 0.15));
    add("底部命中地面(灰)", Math.abs(f[0] - f[1]) < 30 && Math.abs(f[1] - f[2]) < 30, JSON.stringify(f));

    gl.uniform1i(U.debug, 1);
    draw(performance.now() / 1000);
    const gray = (v) => v[0] === v[1] && v[1] === v[2];
    const dv = px(canvas.width >> 1, canvas.height >> 1);
    add("球面命中距离≈1.1", gray(dv) && dv[0] >= 30 && dv[0] <= 58,
        "v=" + dv[0] + " 期望区间[30,58] 即 t∈[0.9,1.3]");
    const fv = px(canvas.width >> 1, Math.floor(canvas.height * 0.15));
    add("地面命中距离≈1.7", gray(fv) && fv[0] >= 52 && fv[0] <= 88,
        "v=" + fv[0] + " 期望区间[52,88] 即 t∈[1.5,2.1]");
    gl.uniform1i(U.debug, 0);

  } else if (spaceMode === SPACE.SPHERE) {
    /* S³：{4,3,3} 超立方体蜂巢。相机在胞腔中心 (0,0,0,1) 朝 +x1：
       中心射线命中墙面 t=π/4≈0.785；uv=(1,1) 方向≈顶点 (½,½,½,½) t=π/3≈1.047；
       uv=(1,0) 方向命中棱 {x1=x2=x4} → 棱线变暗 */
    const orthoS3 = () => {
      const e1 = col(0), e2 = col(1), e3 = col(2), p = col(3);
      return Math.abs(dot4(p, p) - 1) < 1e-9 &&
             Math.abs(dot4(e1, e1) - 1) < 1e-9 && Math.abs(dot4(e2, e2) - 1) < 1e-9 &&
             Math.abs(dot4(e3, e3) - 1) < 1e-9 &&
             Math.abs(dot4(e1, e2)) < 1e-9 && Math.abs(dot4(e1, e3)) < 1e-9 &&
             Math.abs(dot4(e2, e3)) < 1e-9 &&
             Math.abs(dot4(e1, p)) < 1e-9 && Math.abs(dot4(e2, p)) < 1e-9 &&
             Math.abs(dot4(e3, p)) < 1e-9;
    };
    add("S³框架正交(初始)", orthoS3());
    const pInit = col(3);
    advanceCamera(1, 0, 0, 2 * Math.PI);
    const pAfter = col(3);
    const err = Math.hypot(pAfter[0] - pInit[0], pAfter[1] - pInit[1],
                           pAfter[2] - pInit[2], pAfter[3] - pInit[3]);
    add("测地线回原点(2π)", err < 1e-9, "err=" + err.toExponential(2));
    add("S³框架正交(推进2π后)", orthoS3());
    camReset();

    /* 地图骨架：四维超立方体 32 条棱（相机坐标系下） */
    const st = buildSphereTiling();
    add("S³地图骨架(超立方体32棱)", st.length === 32, "edges=" + st.length);
    camReset();
    const centerP = mapProject();
    add("S³地图以相机为中心", Math.hypot(centerP[0], centerP[1]) < 1e-9,
        "u=" + centerP[0].toFixed(4) + "," + centerP[1].toFixed(4));

    draw(performance.now() / 1000);
    const c = px(canvas.width >> 1, canvas.height >> 1);
    add("中心亮墙面(白)", c[0] > 150 &&
        Math.max(c[0], c[1], c[2]) - Math.min(c[0], c[1], c[2]) < 70, JSON.stringify(c));
    const xe = Math.min(Math.round((canvas.width + canvas.height) / 2), canvas.width - 1);
    gl.uniform1i(U.debug, 1);
    draw(performance.now() / 1000);
    const gray = (v) => v[0] === v[1] && v[1] === v[2];
    const dv = px(canvas.width >> 1, canvas.height >> 1);
    add("墙面命中距≈π/4", gray(dv) && dv[0] >= 24 && dv[0] <= 38,
        "v=" + dv[0] + " 期望[24,38] 理论π/4→30");
    const vt = px(xe, canvas.height - 1);
    add("顶点方向命中距≈π/3", gray(vt) && vt[0] >= 33 && vt[0] <= 48,
        "v=" + vt[0] + " 期望[33,48] 理论π/3→40");
    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const ep = px(xe, canvas.height >> 1);
    add("棱线像素显著变暗",
        Math.max(ep[0], ep[1], ep[2]) < 0.6 * Math.max(c[0], c[1], c[2]),
        "edge=" + ep + " face=" + c);
  } else if (spaceMode === SPACE.HYPER) {
    /* H³：{5,3,4} 正十二面体蜂巢。相机在胞腔中心 O=(0,0,0,1) 朝 +z：
       中心射线命中墙面（面心 F）t=ρ≈0.8087。 */
    const ed = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] - a[3] * b[3];
    const G = [
      [1, -Math.cos(Math.PI / 5), 0, 0],
      [-Math.cos(Math.PI / 5), 1, -Math.cos(Math.PI / 3), 0],
      [0, -Math.cos(Math.PI / 3), 1, -Math.cos(Math.PI / 4)],
      [0, 0, -Math.cos(Math.PI / 4), 1]];
    let gErr = 0;
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++)
      gErr = Math.max(gErr, Math.abs(ed(HYPER_NORMALS[a], HYPER_NORMALS[b]) - G[a][b]));
    add("H³ Gram矩阵=Coxeter矩阵", gErr < 1e-12, "err=" + gErr.toExponential(2));

    /* 地图骨架的基本域顶点 E,V：在双曲面上且正交于对应三镜面 */
    const Eh = hyperVertex(0, 2, 3), Vh = hyperVertex(1, 2, 3);
    add("H³骨架顶点E,V有效", !!Eh && !!Vh &&
        Math.abs(ed(Eh, Eh) + 1) < 1e-9 && Math.abs(ed(Eh, HYPER_NORMALS[0])) < 1e-9 &&
        Math.abs(ed(Eh, HYPER_NORMALS[2])) < 1e-9 && Math.abs(ed(Vh, HYPER_NORMALS[1])) < 1e-9 &&
        Math.abs(ed(Vh, HYPER_NORMALS[3])) < 1e-9,
        Eh ? ("E=" + Eh.map((x) => x.toFixed(3)).join(",")) : "null");
    const ht = buildHyperTiling();
    add("H³地图骨架非空", ht.length > 100, "edges=" + ht.length);

    const orthoH = () => {
      const e1 = col(0), e2 = col(1), e3 = col(2), p = col(3);
      return Math.abs(ed(p, p) + 1) < 1e-9 &&
             Math.abs(ed(e1, e1) - 1) < 1e-9 && Math.abs(ed(e2, e2) - 1) < 1e-9 &&
             Math.abs(ed(e3, e3) - 1) < 1e-9 &&
             Math.abs(ed(e1, e2)) < 1e-9 && Math.abs(ed(e1, e3)) < 1e-9 &&
             Math.abs(ed(e2, e3)) < 1e-9 &&
             Math.abs(ed(e1, p)) < 1e-9 && Math.abs(ed(e2, p)) < 1e-9 &&
             Math.abs(ed(e3, p)) < 1e-9;
    };
    add("H³框架正交(初始)", orthoH());
    advanceCamera(1, 0, 0, 1.0);
    const dGeo = Math.acosh(-ed(col(3), [0, 0, 0, 1]));
    add("测地线推进距离=1", Math.abs(dGeo - 1.0) < 1e-9, "d=" + dGeo);
    add("H³框架正交(推进后)", orthoH());

    camReset();
    advanceCamera(0.9, 0.25, 0.1, 3.0);   /* 非轴向推进，折叠后落于一般位置 */
    const folded = new Float64Array(16);
    foldHyper(cam, folded);
    let inside = true;
    for (let j = 0; j < 4; j++) {
      const n = HYPER_NORMALS[j];
      if (folded[12] * n[0] + folded[13] * n[1] + folded[14] * n[2] -
          folded[15] * n[3] < -1e-9) inside = false;
    }
    add("fold折叠进基本域", inside);
    const nf = folded[12] * folded[12] + folded[13] * folded[13] +
               folded[14] * folded[14] - folded[15] * folded[15];
    add("fold保持η范数(−1)", Math.abs(nf + 1) < 1e-9, "η=" + nf);
    let changed = false;
    for (let i = 12; i < 16; i++) if (Math.abs(folded[i] - cam[i]) > 1e-9) changed = true;
    add("fold坐标已改变", changed);

    /* 渲染不变性：折叠相机 vs 未折叠相机（GPU 自行折叠）应渲染一致 */
    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const pts = [[canvas.width >> 1, canvas.height >> 1],
                 [Math.floor(canvas.width * 0.3), Math.floor(canvas.height * 0.6)],
                 [Math.floor(canvas.width * 0.7), Math.floor(canvas.height * 0.4)]];
    const ref = pts.map((pt) => px(pt[0], pt[1]));
    camFolded.set(cam);
    lightFolded.set(HYPER_LIGHT);           /* 未折叠相机须配未折叠光源 */
    draw(performance.now() / 1000, true);
    let invOk = true;
    const invInfo = [];
    for (let i = 0; i < 3; i++) {
      const q = px(pts[i][0], pts[i][1]);
      invInfo.push(ref[i] + "→" + q);
      for (let k = 0; k < 3; k++) if (Math.abs(q[k] - ref[i][k]) > 3) invOk = false;
    }
    add("渲染不变性(折叠≡未折叠)", invOk, invInfo.join(" "));

    camReset();
    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const c = px(canvas.width >> 1, canvas.height >> 1);
    add("中心命中墙面(亮)", c[0] + c[1] + c[2] > 350, JSON.stringify(c));
    gl.uniform1i(U.debug, 1);
    draw(performance.now() / 1000);
    const gray = (v) => v[0] === v[1] && v[1] === v[2];
    const dv = px(canvas.width >> 1, canvas.height >> 1);
    add("墙面命中距≈ρ=0.809", gray(dv) && dv[0] >= 25 && dv[0] <= 37,
        "v=" + dv[0] + " 期望[25,37] 理论0.8087→31");
    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const ey = Math.min(Math.round(canvas.height * 0.809), canvas.height - 1);
    const ep = px(canvas.width >> 1, ey);
    add("棱线像素显著变暗",
        Math.max(ep[0], ep[1], ep[2]) < 0.72 * Math.max(c[0], c[1], c[2]),
        "edge=" + ep + " face=" + c);

    /* 地图随相机重定心：相机恒在圆盘中心；相机坐标系变换保 η 度量 */
    hyperMapMode = 0;
    camReset();
    const pO = mapProject();
    add("H³地图以相机居中(初始)", Math.abs(pO[0]) < 1e-9 && Math.abs(pO[1]) < 1e-9);
    advanceCamera(0.9, 0.3, 0, 1.3);
    const pP = mapProject();
    add("H³地图随相机重定心", Math.hypot(pP[0], pP[1]) < 1e-9,
        "u=" + pP[0].toFixed(6) + "," + pP[1].toFixed(6));
    const wa = [0.3, 0.2, 0.1, 1.0], wb = [-0.1, 0.4, 0.2, 1.2];
    const isoErr = Math.abs(ed(hyperToCam(wa), hyperToCam(wb)) - ed(wa, wb));
    add("H³相机变换保度量", isoErr < 1e-9, "err=" + isoErr.toExponential(2));
    hyperMapMode = 1;
    const kM = mapProject();
    add("H³克莱因模式居中", Math.hypot(kM[0], kM[1]) < 1e-9);
    hyperMapMode = 0;
    camReset();

    /* 逐胞腔着色：相邻胞腔颜色不同（debug4 直接输出胞腔色） */
    gl.uniform1i(U.debug, 4);
    draw(performance.now() / 1000);
    const cc0 = px(canvas.width >> 1, canvas.height >> 1);
    advanceCamera(1, 0, 0, 2.0);
    draw(performance.now() / 1000);
    const cc1 = px(canvas.width >> 1, canvas.height >> 1);
    add("H³逐胞腔颜色不同", colDiff(cc0, cc1) > 30, cc0 + " vs " + cc1);
    gl.uniform1i(U.debug, 0);
    camReset();
  } else if (spaceMode === SPACE.ROOMS) {
    /* {4,5} 直角房间：镜面夹角、折叠、面心到墙距、渲染 */
    const ed = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] - a[3] * b[3];
    const ang = [[0, 1, Math.PI / 4], [1, 2, Math.PI / 5], [0, 2, Math.PI / 2]];
    let aErr = 0;
    for (const [i, j, th] of ang)
      aErr = Math.max(aErr, Math.abs(ed(ROOM_NORMALS[i], ROOM_NORMALS[j]) + Math.cos(th)));
    add("房间镜面夹角(π/4,π/5,π/2)", aErr < 1e-12, "err=" + aErr.toExponential(2));

    /* 面心到墙的距离 = asinh(⟨F, M_F⟩) */
    const dWallF = Math.asinh(ed([0, 0, 0, 1], ROOM_NORMALS[2]));
    add("面心到墙距≈0.531", Math.abs(dWallF - 0.53063) < 1e-3, "d=" + dWallF.toFixed(5));

    /* 折叠：任取域外点反射后应满足三个 ⟨x,M_i⟩ ≥ 0 */
    let q = [0.9, -0.8, 0.3, 1.6];
    for (let iter = 0; iter < 64; iter++) {
      let folded = false;
      for (let j = 0; j < 3; j++) {
        const n = ROOM_NORMALS[j], s = ed(q, n);
        if (s < 0) { folded = true; for (let i = 0; i < 4; i++) q[i] -= 2 * s * n[i]; }
      }
      if (!folded) break;
    }
    let inside = true;
    for (let j = 0; j < 3; j++) if (ed(q, ROOM_NORMALS[j]) < -1e-9) inside = false;
    add("折叠进基本域", inside);

    /* 门洞：棱中点 E 在墙与 M_V 的交线上，应判为门洞（无墙） */
    const E = [0, 0.555893, 0, 1.144123];
    const doorOpen = ed(E, ROOM_NORMALS[0]) < ROOM_DOOR && ed(E, ROOM_NORMALS[2]) < ROOM_DOOR;
    add("棱中点处为门洞", doorOpen);

    /* 渲染：中心为墙（偏蓝亮），底部为地面（暖灰） */
    camReset();
    gl.uniform1i(U.debug, 0);
    draw(performance.now() / 1000);
    const c = px(canvas.width >> 1, canvas.height >> 1);
    add("中心命中墙面(受光)", c[0] + c[1] + c[2] > 150, JSON.stringify(c));
    const f = px(canvas.width >> 1, 1);
    add("向下命中地面(受光)", f[0] + f[1] + f[2] > 100, JSON.stringify(f));

    /* 逐房间着色：相邻房间颜色不同 */
    gl.uniform1i(U.debug, 4);
    camReset();
    draw(performance.now() / 1000);
    const rc0 = px(canvas.width >> 1, canvas.height >> 1);
    advanceCamera(1, 0, 0, 1.6);
    draw(performance.now() / 1000);
    const rc1 = px(canvas.width >> 1, canvas.height >> 1);
    add("房间颜色随房间改变", colDiff(rc0, rc1) > 30, rc0 + " vs " + rc1);
    gl.uniform1i(U.debug, 0);
    camReset();

    /* 封闭性：抬头应命中天花板 */
    rotateCols(1, 2, 1.2);
    gl.uniform1i(U.debug, 1);
    draw(performance.now() / 1000);
    const ceil = px(canvas.width >> 1, canvas.height >> 1);
    const isGray = (v) => v[0] === v[1] && v[1] === v[2];
    add("抬头命中天花板", isGray(ceil) && ceil[0] >= 6 && ceil[0] <= 30,
        "v=" + ceil[0] + " 期望[6,30] 理论t≈0.53→16");
    gl.uniform1i(U.debug, 0);
    camReset();

    /* 碰撞：飞行向下不会穿出地板；步行撞墙不穿模 */
    camReset();
    for (let i = 0; i < 60; i++) advanceCamera(0, 0, -1, 0.1);   // 持续下降
    clampRoomVertical();
    add("飞行不穿出地板", cam[14] >= 0.09, "z=" + cam[14].toFixed(3));
    for (let i = 0; i < 60; i++) advanceCamera(0, 0, 1, 0.1);    // 持续上升
    clampRoomVertical();
    add("飞行不穿出天花板", cam[14] <= ROOM_CEIL_Z - 0.09, "z=" + cam[14].toFixed(3));

    camReset();
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyG" }));
    dispatchEvent(new KeyboardEvent("keyup", { code: "KeyG" }));
    let minA = 1e9, minZ = 1e9;
    for (let i = 0; i < 120; i++) {
      walkMove(1, 0, 0.1);                                       // 朝墙方向持续走
      gravityStep();
      clampRoomVertical();
      const pp = [cam[12], cam[13], cam[14], cam[15]];
      for (let it = 0; it < 64; it++) {
        let folded = false;
        for (let j = 0; j < 3; j++) {
          const n = ROOM_NORMALS[j];
          const sc = pp[0] * n[0] + pp[1] * n[1] + pp[2] * n[2] - pp[3] * n[3];
          if (sc < 0) { folded = true; for (let k = 0; k < 4; k++) pp[k] -= 2 * sc * n[k]; }
        }
        if (!folded) break;
      }
      const nn = ROOM_NORMALS[2];
      minA = Math.min(minA, Math.asinh(
        Math.max(pp[0] * nn[0] + pp[1] * nn[1] + pp[2] * nn[2] - pp[3] * nn[3], 0)));
      minZ = Math.min(minZ, cam[14]);
    }
    add("步行不穿墙(未进入墙厚)", minA > ROOM_WALL_T, "minA=" + minA.toFixed(3));
    add("步行始终在地板之上", minZ > 0.05, "minZ=" + minZ.toFixed(3));

    /* 自动上台阶：门洞处地面抬高 ROOM_SILL_D，重力把相机抬到更高处 */
    const Sp = [0, 0.555893, 0.5, 0];
    Sp[3] = Math.sqrt(Sp[1] * Sp[1] + Sp[2] * Sp[2] + 1);
    for (let i = 0; i < 4; i++) cam[12 + i] = Sp[i];
    orthonormalizeH3();
    add("门洞门槛判定", roomOverSill(Sp) && !roomOverSill([0, 0, 0.5, Math.sqrt(1.25)]));
    for (let i = 0; i < 120; i++) gravityStep();
    add("门洞处自动上台阶(眼高稳定)", Math.abs(heightAlongUp() - walkH) < 0.05,
        "h=" + heightAlongUp().toFixed(3));
    add("门槛使相机抬高", cam[14] > 0.55, "z=" + cam[14].toFixed(3));
    dispatchEvent(new KeyboardEvent("keydown", { code: "KeyG" }));
    dispatchEvent(new KeyboardEvent("keyup", { code: "KeyG" }));
    camReset();
  }

  /* 性能分级（放在像素测试之后，避免改变画布尺寸影响读数） */
  const t0 = tier, m0 = maxSteps, sc0 = renderScale;
  applyTier(2);
  add("画质分级(高级:96步/75%)", tier === 2 && maxSteps === 96 && Math.abs(renderScale - 0.75) < 1e-9,
      "tier=" + tier + " steps=" + maxSteps + " scale=" + renderScale);
  applyTier(t0);
  add("画质分级可还原", tier === t0 && maxSteps === m0 && Math.abs(renderScale - sc0) < 1e-9);

  /* 自动画质：低帧先降分辨率→步进数→关AA；高帧反向 */
  const as0 = maxSteps, aa0 = aaOn, ar0 = renderScale;
  renderScale = 0.35; maxSteps = 128; aaOn = true;
  autoQuality(10);
  add("自动画质低帧降步进", maxSteps < 128, "steps=" + maxSteps);
  for (let i = 0; i < 40; i++) autoQuality(10);
  add("自动画质低帧关AA", !aaOn);
  maxSteps = 40; aaOn = false; renderScale = 0.35;
  for (let i = 0; i < 80; i++) autoQuality(80);
  add("自动画质高帧升步进/AA", aaOn && maxSteps > 40,
      "steps=" + maxSteps + " aa=" + aaOn);
  renderScale = ar0; maxSteps = as0; aaOn = aa0; resize();

  /* 脚步声：合成不报错、迈步计程按步距触发 */
  const snd0 = soundOn;
  soundOn = true;
  let audioOk = true;
  try { playFootstep(); } catch (e) { audioOk = false; }
  add("脚步声合成不报错", audioOk);
  stepAccum = 0;
  const wm = walkMode; walkMode = true;
  maybeFootstep(0.5);
  const acc1 = stepAccum;
  maybeFootstep(0.5);
  add("迈步计程触发", Math.abs(acc1 - 0.5) < 1e-9 && stepAccum < 0.5, "acc=" + stepAccum.toFixed(3));
  walkMode = wm; soundOn = snd0; stepAccum = 0;

  /* 脚下材质（房间 vs 棱线/门槛） */
  const wm2 = walkMode; walkMode = true;
  camReset();
  const mval = footMaterial();
  add("脚下材质判定有效", mval === 0 || mval === 1, "mat=" + mval);
  if (spaceMode === SPACE.ROOMS) {
    const Sp2 = [0, 0.555893, 0.5, 0];
    Sp2[3] = Math.sqrt(Sp2[1] * Sp2[1] + Sp2[2] * Sp2[2] + 1);
    for (let i = 0; i < 4; i++) cam[12 + i] = Sp2[i];
    add("门槛处材质=棱线", footMaterial() === 1);
  }
  walkMode = wm2; camReset();

  /* 步速联动：Shift 跑步加速（步频 = 步速 / 步距，随速度变化） */
  const settle = () => { for (let i = 0; i < 80; i++) gravityStep(); };
  const p4 = () => [cam[12], cam[13], cam[14], cam[15]];
  camReset(); enterWalkMode(); settle();
  keys.clear(); keys.add("KeyW");
  const wp0 = p4(); updateCamera(0.05);
  const dWalk = geodesicDist(wp0, p4());
  camReset(); enterWalkMode(); settle();
  keys.add("ShiftLeft");
  const wp1 = p4(); updateCamera(0.05);
  const dRun = geodesicDist(wp1, p4());
  keys.clear(); walkMode = false; camReset();
  add("Shift跑步加速(步频随速)", dRun > dWalk * 1.3 && dWalk > 0,
      "walk=" + dWalk.toFixed(3) + " run=" + dRun.toFixed(3));

  /* 小地图缩放：放大/缩小与上下限 */
  const mz0 = mapZoom;
  adjustMapZoom(1.25);
  add("地图缩放可放大", mapZoom > mz0, "zoom=" + mapZoom.toFixed(3));
  for (let i = 0; i < 40; i++) adjustMapZoom(1.25);
  add("地图缩放上限=4", Math.abs(mapZoom - 4.0) < 1e-9, "zoom=" + mapZoom.toFixed(3));
  for (let i = 0; i < 60; i++) adjustMapZoom(0.8);
  add("地图缩放下限=0.4", Math.abs(mapZoom - 0.4) < 1e-9, "zoom=" + mapZoom.toFixed(3));
  mapZoom = mz0;

  /* 地图拖拽平移与双击复位 */
  const pz0 = mapPan.slice(), pzm = mapZoom;
  mapCanvas.dispatchEvent(new MouseEvent("mousedown", { clientX: 100, clientY: 100, bubbles: true }));
  dispatchEvent(new MouseEvent("mousemove", { clientX: 130, clientY: 90, bubbles: true }));
  dispatchEvent(new MouseEvent("mouseup", {}));
  add("地图拖拽平移", Math.abs(mapPan[0] - 30) < 1e-9 && Math.abs(mapPan[1] + 10) < 1e-9,
      "pan=" + mapPan[0] + "," + mapPan[1]);
  mapZoom = 2;
  mapCanvas.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
  add("地图双击复位", mapPan[0] === 0 && mapPan[1] === 0 && mapZoom === 1);

  /* 以指针为中心缩放：指针下的内容点应保持不动 */
  mapZoom = 1; mapPan = [0, 0];
  const mw = mapCanvas.width, mh = mapCanvas.height;
  const mx = 40, my = 60, baseR = Math.min(mw, mh) / 2 - 12;
  const ux0 = (mx - mw / 2 - mapPan[0]) / baseR;
  const uy0 = (my - mh / 2 - mapPan[1]) / baseR;
  adjustMapZoomAt(2, mx, my);
  const R1 = baseR * mapZoom;
  const sx = mw / 2 + mapPan[0] + ux0 * R1;
  const sy = mh / 2 + mapPan[1] + uy0 * R1;
  add("地图以指针为中心缩放", Math.abs(sx - mx) < 1e-6 && Math.abs(sy - my) < 1e-6,
      "s=" + sx.toFixed(3) + "," + sy.toFixed(3));
  mapPan = pz0; mapZoom = pzm;

  /* 触屏手势：单指平移、双指捏合缩放 */
  const tp0 = mapPan.slice();
  mapGestureStart([{ clientX: 100, clientY: 100 }]);
  mapGestureMove([{ clientX: 120, clientY: 110 }]);
  mapGestureEnd([]);
  add("触屏单指平移", mapPan[0] - tp0[0] === 20 && mapPan[1] - tp0[1] === 10,
      "pan=" + (mapPan[0] - tp0[0]) + "," + (mapPan[1] - tp0[1]));
  mapZoom = 1; mapPan = [0, 0];
  mapGestureStart([{ clientX: 60, clientY: 100 }, { clientX: 160, clientY: 100 }]);
  mapGestureMove([{ clientX: 40, clientY: 100 }, { clientX: 180, clientY: 100 }]);
  add("触屏双指捏合缩放", Math.abs(mapZoom - 1.4) < 1e-9, "zoom=" + mapZoom.toFixed(3));
  mapGestureEnd([]); mapPan = tp0; mapZoom = 1;

  /* H³ 胞腔编号（稳定） */
  const clb = buildHyperCellLabels(), clb2 = buildHyperCellLabels();
  add("H³胞腔编号(稳定)", clb.length > 5 && clb[0].i === 0 && clb.length === clb2.length &&
      clb[clb.length - 1].c.join(",") === clb2[clb2.length - 1].c.join(","), "n=" + clb.length);

  /* 脚下材质编号有效（0..3） */
  const fmv = footMaterial();
  add("脚下材质编号有效", fmv >= 0 && fmv <= 3 && FOOT_CFG.length === 4, "mat=" + fmv);

  /* 环境音启动不报错 */
  let ambOk = true;
  const amb0 = soundOn;
  try { soundOn = true; startAmbient(); updateAmbient(); } catch (e) { ambOk = false; }
  add("环境音启动不报错", ambOk);
  soundOn = amb0; updateAmbient();

  /* 移动端适配：控件存在、摇杆向量与钳制、驱动移动 */
  add("触屏控件已创建", !!document.getElementById("joy") && !!document.getElementById("joyKnob") &&
      !!document.getElementById("touchui") && typeof isTouch === "boolean", "touch=" + isTouch);
  joyBase = [100, 100];
  const jv1 = touchJoystick(100, 40), jv2 = touchJoystick(160, 100), jv3 = touchJoystick(240, 100);
  add("摇杆前推=前进", Math.abs(jv1.f - 1) < 1e-9 && Math.abs(jv1.s) < 1e-9, "f=" + jv1.f.toFixed(3));
  add("摇杆右推=右移/超程钳制", Math.abs(jv2.s - 1) < 1e-9 && Math.abs(jv3.s - 1) < 1e-9);
  joyEl.style.display = "none"; joyKnob.style.display = "none";
  camReset(); walkMode = false;
  const mcp0 = [cam[12], cam[13], cam[14], cam[15]];
  keys.clear(); touchF = 1;
  updateCamera(0.05);
  touchF = 0;
  add("摇杆驱动相机移动", geodesicDist(mcp0, [cam[12], cam[13], cam[14], cam[15]]) > 0.001);
  camReset();

  const div = document.createElement("div");
  div.id = "selftest";
  div.textContent = JSON.stringify({ pass: checks.every((c) => c.ok), checks });
  document.body.appendChild(div);
}

/* ---------------- 主循环 ---------------- */
let last = performance.now();
let lastSig = NaN;
/* 相机指纹：用于判断相机是否静止（静止才做时间超采样） */
function camSignature() {
  let s = 0;
  for (let i = 0; i < 16; i++) s += cam[i] * (i + 1.37);
  return s;
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  updateCamera(dt);
  const sig = camSignature();
  camDirty = !(Math.abs(sig - lastSig) < 1e-7);
  lastSig = sig;
  recordTrail();
  draw(now / 1000);
  updateHUD(now, dt);
  drawMinimap();
}

if (isSelfTest) {
  hudTimer = -1e9;
  const stLoop = () => {
    frame(performance.now());
    if (++stFrames === 15) { runSelfTest(); return; }
    setTimeout(stLoop, 16);
  };
  setTimeout(stLoop, 16);
} else {
  const rafLoop = (now) => { frame(now); requestAnimationFrame(rafLoop); };
  requestAnimationFrame(rafLoop);
}
</script>
