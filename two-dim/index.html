<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二向箔 · 二维化模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #scene { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: #6fa8dc;
      font: 12px/1.6 Consolas, "Courier New", monospace;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(111, 168, 220, 0.6);
      pointer-events: none;
      user-select: none;
    }
    #stats {
      position: fixed;
      right: 16px;
      top: 14px;
      color: #7fe0c0;
      font: 12px/1.6 Consolas, "Courier New", monospace;
      text-shadow: 0 0 8px rgba(127, 224, 192, 0.5);
      pointer-events: none;
      user-select: none;
      text-align: right;
      white-space: pre;
    }
    /* 屏幕上的物体切换按钮 */
    #objects {
      position: fixed;
      left: 16px;
      top: 14px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .objBtn {
      cursor: pointer;
      text-align: left;
      border: 1px solid rgba(90,140,190,0.35);
      background: rgba(12,26,44,0.55);
      color: #9fc4e8;
      padding: 6px 12px;
      font: 12px/1.2 "Microsoft YaHei", Consolas, monospace;
      letter-spacing: 1px;
      border-radius: 2px;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .objBtn:hover { background: rgba(30,60,100,0.7); color: #e0f2ff; }
    #objects a.objBtn {
      text-decoration: none;
      text-align: center;
      color: #7fe0c0;
      border-color: rgba(127,224,192,0.35);
    }
    #objects a.objBtn:hover { background: rgba(20,60,50,0.7); color: #dffff2; }
    .objBtn.active {
      background: rgba(40,90,150,0.78);
      color: #ffffff;
      border-color: rgba(140,210,255,0.9);
      box-shadow: 0 0 16px rgba(120,200,255,0.6);
    }
    /* 观测目标列表的收起/展开 */
    #objToggle {
      font-weight: 600;
      color: #bcd8f4;
      border-color: rgba(140,200,255,0.55);
      background: rgba(20,40,70,0.72);
    }
    #objectList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      max-height: 2600px;
      opacity: 1;
      transition: max-height 0.30s ease, opacity 0.22s ease;
    }
    #objects.collapsed #objectList {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 50%, rgba(8,14,30,0.55), rgba(0,0,0,0.92));
      transition: opacity 0.6s ease;
    }
    #start.hidden { opacity: 0; pointer-events: none; }
    #start h1 {
      color: #bfe6ff;
      font: 200 40px/1.2 "Microsoft YaHei", Consolas, monospace;
      letter-spacing: 16px;
      text-indent: 16px;
      text-shadow: 0 0 26px rgba(90,180,255,0.8);
    }
    #start .sub {
      color: #5d7fa5;
      font: 13px/1.6 "Microsoft YaHei", Consolas, monospace;
      letter-spacing: 4px;
    }
    #start .objname {
      color: #8fd0ff;
      font: 18px/1.3 "Microsoft YaHei", Consolas, monospace;
      letter-spacing: 6px;
      text-shadow: 0 0 18px rgba(120,200,255,0.8);
    }
    #start .hint {
      color: #46617f;
      font: 12px/1.6 "Microsoft YaHei", Consolas, monospace;
      letter-spacing: 2px;
    }
    #startBtn {
      cursor: pointer;
      border: 1px solid rgba(120,200,255,0.6);
      background: rgba(20,50,90,0.35);
      color: #dff2ff;
      padding: 12px 44px;
      letter-spacing: 8px;
      text-indent: 8px;
      font: 14px/1 "Microsoft YaHei", Consolas, monospace;
      border-radius: 2px;
      box-shadow: 0 0 24px rgba(80,170,255,0.35), inset 0 0 18px rgba(80,170,255,0.15);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    #startBtn:hover {
      background: rgba(40,90,150,0.55);
      box-shadow: 0 0 44px rgba(120,200,255,0.75), inset 0 0 22px rgba(120,200,255,0.25);
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud">拖拽旋转 · 滚轮缩放 · 右键平移 · 1-9/按钮 切换物体 · X 透视 · [ ] 变速 · P 暂停 · V 远端 · S 侧视 · R 重放</div>
  <div id="stats"></div>
  <div id="objects"></div>

  <div id="start">
    <h1>二 向 箔</h1>
    <div class="sub">二维化降维打击模拟</div>
    <div class="objname" id="objName">类地行星</div>
    <div class="hint">左上角可切换观测目标 · 底部「数学原理」查看交互讲解</div>
    <button id="startBtn">点 击 开 始</button>
  </div>

  <!--
    使用经典脚本（非 ES Module），保证本地双击 file:// 打开即可运行。
    注意加载顺序：shaders → Pass → MaskPass/ShaderPass → EffectComposer → RenderPass → UnrealBloomPass
  -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("scene");
      var statsEl = document.getElementById("stats");
      var startEl = document.getElementById("start");
      var startBtn = document.getElementById("startBtn");
      var objNameEl = document.getElementById("objName");
      var objectsEl = document.getElementById("objects");

      // 渲染器
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      // 场景与深邃宇宙背景色
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x03040a);

      // 透视相机
      var camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        20000
      );
      camera.position.set(0, 8, 26);
      camera.lookAt(0, 0, 0);

      // 坐标轴辅助器
      scene.add(new THREE.AxesHelper(9));

      // ------------------------------------------------------------------
      // 星空
      // ------------------------------------------------------------------
      (function buildStars() {
        var starCount = 3000;
        var starGeo = new THREE.BufferGeometry();
        var positions = new Float32Array(starCount * 3);
        for (var i = 0; i < starCount; i++) {
          var r = 900 + Math.random() * 2500;
          var theta = Math.random() * Math.PI * 2;
          var phi = Math.acos(2 * Math.random() - 1);
          positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
        }
        starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        var starMat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 3,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.85,
          depthWrite: false
        });
        scene.add(new THREE.Points(starGeo, starMat));
      })();

      // ------------------------------------------------------------------
      // 3D 值噪声（用于陆地/海洋、恒星米粒、气巨条带、小行星凹凸）
      // ------------------------------------------------------------------
      function hash3(i, j, k) {
        var h = (Math.imul(i, 374761393) +
                 Math.imul(j, 668265263) +
                 Math.imul(k, 1274126177)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        h = h ^ (h >>> 16);
        return (h >>> 0) / 4294967296;
      }
      function noise3(x, y, z) {
        var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        var xf = x - xi, yf = y - yi, zf = z - zi;
        var u = xf * xf * (3 - 2 * xf);
        var v = yf * yf * (3 - 2 * yf);
        var w = zf * zf * (3 - 2 * zf);
        var n000 = hash3(xi, yi, zi),     n100 = hash3(xi + 1, yi, zi);
        var n010 = hash3(xi, yi + 1, zi), n110 = hash3(xi + 1, yi + 1, zi);
        var n001 = hash3(xi, yi, zi + 1), n101 = hash3(xi + 1, yi, zi + 1);
        var n011 = hash3(xi, yi + 1, zi + 1), n111 = hash3(xi + 1, yi + 1, zi + 1);
        var a = n000 + (n100 - n000) * u;
        var b = n010 + (n110 - n010) * u;
        var c = n001 + (n101 - n001) * u;
        var d = n011 + (n111 - n011) * u;
        var e = a + (b - a) * v;
        var f = c + (d - c) * v;
        return e + (f - e) * w;
      }
      function fbm(x, y, z) {
        var s = 0, amp = 0.5, freq = 1;
        for (var o = 0; o < 4; o++) {
          s += amp * noise3(x * freq, y * freq, z * freq);
          freq *= 2.07;
          amp *= 0.5;
        }
        return s / 0.9375;
      }
      function fbm2(x, y, z) {   // 轻量 2 阶，供小行星凹凸使用
        return (0.5 * noise3(x, y, z) + 0.25 * noise3(x * 2.1 + 5.2, y * 2.1, z * 2.1)) / 0.75;
      }
      function mixHex(a, b, k) {
        var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
        var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
        return [
          (ar + (br - ar) * k) / 255,
          (ag + (bg - ag) * k) / 255,
          (ab + (bb - ab) * k) / 255
        ];
      }
      function hexF(h) {
        return [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
      }
      function buildLUT(stops) {
        var n = 256, out = new Array(n), seg = 0;
        for (var i = 0; i < n; i++) {
          var t = i / (n - 1);
          while (seg < stops.length - 2 && t > stops[seg + 1][0]) seg++;
          var a = stops[seg], b = stops[seg + 1];
          var k = (t - a[0]) / (b[0] - a[0]);
          if (k < 0) k = 0; else if (k > 1) k = 1;
          out[i] = [
            a[1][0] + (b[1][0] - a[1][0]) * k,
            a[1][1] + (b[1][1] - a[1][1]) * k,
            a[1][2] + (b[1][2] - a[1][2]) * k
          ];
        }
        return out;
      }

      // ==================================================================
      //  物体生成：每个物体由若干“层”组成，密度用粒子数加权表达
      //  所有物体以原点为中心、Z 为跌落轴；radius 为特征尺寸
      // ==================================================================
      var BASE_COUNT = 1500000;
      var currentObject = 0;
      var currentRadius = 5;
      var currentExtent = 5;   // 含环等外部结构的最大横向半径，用于相机 framing
      var currentCount = BASE_COUNT;

      function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

      // 体积均匀地在球壳 [f0,f1] 内采样（返回归一化半径比例）
      function shellFrac(f0, f1) {
        return Math.cbrt(f0 * f0 * f0 + Math.random() * (f1 * f1 * f1 - f0 * f0 * f0));
      }
      // 球面均匀方向写入 dx,dy,dz
      function randDir(out) {
        var th = Math.random() * Math.PI * 2;
        var cz = 2 * Math.random() - 1;
        var s = Math.sqrt(1 - cz * cz);
        out[0] = s * Math.cos(th);
        out[1] = s * Math.sin(th);
        out[2] = cz;
      }

      // ---- 类地行星：内核 / 外核 / 地幔 / 地壳(海陆)——与恒星、气巨一致的分层实现 ----
      function buildEarth(P, C, count, R) {
        var SEA = 0.50;
        // [f0, f1, c0, c1, weight, brightness]  由内到外，分层越清晰二维化后越像同心环
        var L = [
          [0.00, 0.16, 0xfff6d8, 0xffd24a, 0.14, 1.35],  // 内核（炽白黄，自发光）
          [0.16, 0.38, 0xffa020, 0xff5010, 0.20, 1.15],  // 外核（炽橙）
          [0.38, 0.72, 0xd04010, 0x8a2a10, 0.26, 0.95],  // 下地幔（橙红）
          [0.72, 0.86, 0x6a3a20, 0x3a2418, 0.14, 0.85],  // 上地幔（暗棕）
          [0.86, 1.00, 0x2f7d32, 0x1f7fb0, 0.26, 1.00]   // 地壳（fbm 海陆）
        ];
        var cum = [], acc = 0, j;
        for (j = 0; j < L.length; j++) { acc += L[j][4]; cum.push(acc); }
        var d = [0, 0, 0];
        for (var i = 0; i < count; i++) {
          var u = Math.random(), li = 0;
          while (li < L.length - 1 && u > cum[li]) li++;
          var ly = L[li];
          var f = shellFrac(ly[0], ly[1]);
          var radius = R * f;
          randDir(d);
          var i3 = i * 3;
          P[i3] = radius * d[0]; P[i3 + 1] = radius * d[1]; P[i3 + 2] = radius * d[2];

          var lt = (f - ly[0]) / (ly[1] - ly[0]);
          if (lt < 0) lt = 0; else if (lt > 1) lt = 1;
          var col = mixHex(ly[2], ly[3], lt);
          var r = col[0], g = col[1], b = col[2];
          if (li === L.length - 1) {                     // 最外层：fbm 生成陆地/海洋
            var n = fbm(d[0] * 2.2 + 11.3, d[1] * 2.2 + 4.7, d[2] * 2.2 + 19.1);
            n = (n - 0.5) * 1.6 + 0.5;
            if (n < 0) n = 0; else if (n > 1) n = 1;
            var sc;
            if (n > SEA) sc = mixHex(0x2f7d32, 0x9c8f4e, (n - SEA) / (1 - SEA));
            else sc = mixHex(0x08305e, 0x1f7fb0, n / SEA);
            r = sc[0]; g = sc[1]; b = sc[2];
          }
          var br = ly[5];
          C[i3] = r * br; C[i3 + 1] = g * br; C[i3 + 2] = b * br;
        }
      }

      // ---- 恒星：核 / 辐射层 / 对流层 / 光球（米粒组织）----
      function buildStar(P, C, count, R) {
        // [f0,f1, c0, c1, weight, brightness]
        var L = [
          [0.00, 0.25, 0xfff8e0, 0xffd070, 0.22, 1.55],
          [0.25, 0.60, 0xffc040, 0xff8020, 0.30, 1.30],
          [0.60, 0.90, 0xff6020, 0xff3010, 0.30, 1.05],
          [0.90, 1.00, 0xffdc80, 0xffa030, 0.18, 1.15]
        ];
        var cum = [], acc = 0, j;
        for (j = 0; j < L.length; j++) { acc += L[j][4]; cum.push(acc); }
        var d = [0, 0, 0];
        for (var i = 0; i < count; i++) {
          var u = Math.random(), li = 0;
          while (li < L.length - 1 && u > cum[li]) li++;
          var ly = L[li];
          var f = shellFrac(ly[0], ly[1]);
          var radius = R * f;
          randDir(d);
          var i3 = i * 3;
          P[i3] = radius * d[0]; P[i3 + 1] = radius * d[1]; P[i3 + 2] = radius * d[2];

          var lt = (f - ly[0]) / (ly[1] - ly[0]);
          if (lt < 0) lt = 0; else if (lt > 1) lt = 1;
          var col = mixHex(ly[2], ly[3], lt);
          var br = ly[5];
          if (li === L.length - 1) {
            br *= 0.75 + 0.5 * fbm(d[0] * 6 + 3.1, d[1] * 6 + 7.7, d[2] * 6 + 1.3);
          }
          C[i3] = col[0] * br; C[i3 + 1] = col[1] * br; C[i3 + 2] = col[2] * br;
        }
      }

      // ---- 气态巨行星：内核 / 金属氢 / 液氢 / 大气带 + 冰环 ----
      function buildGasGiant(P, C, count, R) {
        var L = [
          [0.00, 0.15, 0xffb050, 0xff7030, 0.16, 1.10],
          [0.15, 0.45, 0x6038b0, 0x3a2090, 0.24, 0.90],
          [0.45, 0.75, 0x4060d0, 0x2f50b0, 0.24, 0.90],
          [0.75, 1.00, 0xd8c090, 0xb08050, 0.24, 0.95]
        ];
        var cum = [], acc = 0, j;
        for (j = 0; j < L.length; j++) { acc += L[j][4]; cum.push(acc); }
        var ringShare = 0.16;
        var total = acc + ringShare;
        var d = [0, 0, 0];
        var rIn = 1.40 * R, rOut = 1.75 * R;
        for (var i = 0; i < count; i++) {
          var i3 = i * 3;
          var u = Math.random();
          if (u > acc / total) {          // 冰环（赤道面薄环）
            var rr = Math.sqrt(rIn * rIn + Math.random() * (rOut * rOut - rIn * rIn));
            var ang = Math.random() * Math.PI * 2;
            P[i3] = rr * Math.cos(ang);
            P[i3 + 1] = rr * Math.sin(ang);
            P[i3 + 2] = (Math.random() - 0.5) * 0.05 * R;
            var rc = mixHex(0xdfe8f0, 0x9fb4c8, (rr - rIn) / (rOut - rIn));
            C[i3] = rc[0] * 0.9; C[i3 + 1] = rc[1] * 0.9; C[i3 + 2] = rc[2] * 0.9;
            continue;
          }
          var li = 0;
          while (li < L.length - 1 && u > cum[li]) li++;
          var ly = L[li];
          var radius = R * shellFrac(ly[0], ly[1]);
          randDir(d);
          P[i3] = radius * d[0]; P[i3 + 1] = radius * d[1]; P[i3 + 2] = radius * d[2];

          var lt = (radius / R - ly[0]) / (ly[1] - ly[0]);
          if (lt < 0) lt = 0; else if (lt > 1) lt = 1;
          var col = mixHex(ly[2], ly[3], lt);
          var br = ly[5];
          if (li === L.length - 1) {      // 大气纬向条带
            var band = 0.5 + 0.5 * Math.sin(d[2] * 16.0);
            col = mixHex(0xe8d2a0, 0x9a6a40, band);
            br = 0.95;
          }
          C[i3] = col[0] * br; C[i3 + 1] = col[1] * br; C[i3 + 2] = col[2] * br;
        }
      }

      // ---- 星际战舰：流线主体 / 桥楼 / 上下引擎舱 / 后掠机翼 / 背鳍 / 炮塔 / 舷窗 / 引擎辉光 ----
      function buildStarship(P, C, count, R) {
        var a = R;   // 沿 X 的半长（船首朝 +X）；Y 为垂直方向（默认视角可见）
        // 组件占比：外壳 .27 | 桥楼 .06 | 机翼 .12 | 引擎舱 .15 | 辉光 .05
        //           炮塔 .06 | 舷窗 .05 | 背鳍 .06 | 细节 .18
        var cum = [0.27, 0.33, 0.45, 0.60, 0.65, 0.71, 0.76, 0.82, 1.0];
        for (var i = 0; i < count; i++) {
          var i3 = i * 3, u = Math.random();
          var x = 0, y = 0, z = 0, col, br = 1.0;
          if (u < cum[0]) {                     // 主体外壳：两端收窄的流线体
            x = (Math.random() * 2 - 1) * a;
            var t = clamp01((x + a) / (2 * a));
            var prof = Math.pow(Math.sin(Math.PI * t), 0.5);
            var hy = 0.30 * R * prof, hz = 0.22 * R * prof;
            var ang = Math.random() * Math.PI * 2;
            var rr = Math.random() < 0.62 ? 1.0 : Math.sqrt(Math.random());
            y = Math.sin(ang) * hy * rr;
            z = Math.cos(ang) * hz * rr;
            col = mixHex(0xc6ced6, 0x606a74, 0.30 + 0.50 * Math.random());
            if (Math.abs(y) < 0.015 * R)        // 纵向装甲带
              col = mixHex(0x323a42, 0x232a31, Math.random());
          } else if (u < cum[1]) {              // 桥楼（顶部靠船首）
            x = 0.16 * R + Math.random() * 0.22 * R;
            y = 0.28 * R + Math.random() * 0.16 * R;
            z = (Math.random() * 2 - 1) * 0.12 * R;
            col = mixHex(0x8c98a4, 0x4e5862, Math.random());
          } else if (u < cum[2]) {              // 后掠机翼（带上反角，侧视可见）
            var sideW = Math.random() < 0.5 ? -1 : 1;
            x = -0.10 * R - Math.random() * 0.62 * R;
            z = sideW * (0.12 * R + Math.random() * 0.55 * R);
            y = sideW * (0.04 * R + Math.random() * 0.17 * R);
            col = mixHex(0xbec6d0, 0x55606a, Math.random());
            br = 0.95;
          } else if (u < cum[3]) {              // 引擎舱（尾部上下两根圆筒）
            var sideN = Math.random() < 0.5 ? -1 : 1;
            var cy = sideN * 0.30 * R;
            x = -0.50 * R - Math.random() * 0.40 * R;
            var an = Math.random() * Math.PI * 2;
            var rad = 0.10 * R;
            if (Math.random() < 0.68) {         // 筒壁
              y = cy + Math.cos(an) * rad;
              z = Math.sin(an) * rad;
            } else {                            // 筒内
              var rf = Math.sqrt(Math.random());
              y = cy + Math.cos(an) * rad * rf;
              z = Math.sin(an) * rad * rf;
            }
            col = mixHex(0x9aa4ae, 0x464f58, Math.random());
          } else if (u < cum[4]) {              // 引擎辉光（喷口）
            var sideG = Math.random() < 0.5 ? -1 : 1;
            x = -0.90 * R - Math.random() * 0.55 * R;
            var ag = Math.random() * Math.PI * 2;
            var gr = 0.09 * R * Math.sqrt(Math.random());
            y = sideG * 0.30 * R + Math.cos(ag) * gr;
            z = Math.sin(ag) * gr;
            col = mixHex(0xe6f6ff, 0x36a0ff, Math.random());
            br = 1.9;
          } else if (u < cum[5]) {              // 炮塔
            x = (Math.random() * 2 - 1) * 0.72 * R;
            var tp = Math.pow(Math.sin(Math.PI * clamp01((x + a) / (2 * a))), 0.5);
            y = 0.30 * R * tp + 0.02 * R;
            z = (Math.random() * 2 - 1) * 0.10 * R;
            col = mixHex(0x6e7882, 0x343d46, Math.random());
            br = 0.9;
          } else if (u < cum[6]) {              // 舷窗（自发光）
            x = (Math.random() * 2 - 1) * 0.80 * R;
            var wp = Math.pow(Math.sin(Math.PI * clamp01((x + a) / (2 * a))), 0.5);
            var wa = Math.random() * Math.PI * 2;
            y = Math.sin(wa) * 0.30 * R * wp * 1.02;
            z = Math.cos(wa) * 0.22 * R * wp * 1.02;
            col = mixHex(0xfff0c0, 0x86d2ff, Math.random());
            br = 1.6;
          } else if (u < cum[7]) {              // 背鳍 / 腹鳍（竖直薄板）
            var sideF = Math.random() < 0.5 ? 1 : -1;
            x = -0.30 * R - Math.random() * 0.55 * R;
            y = sideF * (0.30 * R + Math.random() * 0.30 * R);
            z = (Math.random() * 2 - 1) * 0.012 * R;
            col = mixHex(0x929ca6, 0x4a545e, Math.random());
            br = 0.95;
          } else {                              // 细节 / 天线 / 桁架
            x = (Math.random() * 2 - 1) * a * 0.92;
            var dp = Math.pow(Math.sin(Math.PI * clamp01((x + a) / (2 * a))), 0.5);
            y = (Math.random() * 2 - 1) * 0.34 * R * dp;
            z = (Math.random() * 2 - 1) * 0.24 * R * dp;
            col = mixHex(0x525c66, 0x2b333b, Math.random());
            br = 0.85;
          }
          P[i3] = x; P[i3 + 1] = y; P[i3 + 2] = z;
          C[i3] = col[0] * br; C[i3 + 1] = col[1] * br; C[i3 + 2] = col[2] * br;
        }
      }

      // 城市照明：以三颗太阳沿轴的带状光晕近似
      function cityLight(z, SUNZ, H) {
        var best = 0;
        for (var s = 0; s < SUNZ.length; s++) {
          var dz = (z - SUNZ[s]) / (0.42 * H);
          var v = Math.exp(-dz * dz);
          if (v > best) best = v;
        }
        return best;
      }

      // ---- 太空城：圆柱外壳 / 内壁一圈城市（楼房轮廓 + 灯光）/ 三颗核聚变太阳 ----
      function buildSpaceCity(P, C, count, R) {
        var H = 1.0 * R;                 // 沿 Z（圆柱轴，也是跌落轴）的半长
        var rWall = 0.95 * R;            // 外壳半径
        var cityR = 0.86 * R;            // 城市内壁半径
        var SUNZ = [-0.55 * H, 0, 0.55 * H];
        var SUNC = [[0xfff6da, 0xffc25f], [0xfff6da, 0xffb040], [0xfff6da, 0xffc25f]];
        // 预生成楼房（高度沿径向朝轴）
        var NB = 200, bld = [];
        for (var b = 0; b < NB; b++) {
          var th = (b / NB) * Math.PI * 2 + (Math.random() - 0.5) * 0.028;
          var hh = 0.06 * R + Math.random() * 0.30 * R;
          var rb = cityR - Math.random() * 0.03 * R;
          var rt = rb - hh;
          var bz = 0.010 * R + Math.random() * 0.045 * R;   // 半厚（沿轴）
          var z0 = (Math.random() * 2 - 1) * (H - bz - 0.06 * R);
          var bw = 0.018 * R + Math.random() * 0.040 * R;   // 半宽（切向）
          bld.push([th, rb, rt, bz, z0, bw]);
        }
        var d = [0, 0, 0];
        // 组件占比：外壳 .30 | 结构环 .08 | 城市地面 .12 | 楼房 .32 | 灯光 .12 | 太阳 .06
        var cum = [0.30, 0.38, 0.50, 0.82, 0.94, 1.0];
        for (var i = 0; i < count; i++) {
          var i3 = i * 3, u = Math.random();
          var x = 0, y = 0, z = 0, col, br = 1.0;
          if (u < cum[0]) {                 // 圆柱外壳
            var ang = Math.random() * Math.PI * 2;
            x = Math.cos(ang) * rWall;
            y = Math.sin(ang) * rWall;
            z = (Math.random() * 2 - 1) * H;
            col = mixHex(0xa6bfd2, 0x496172, Math.random());
            br = 0.85;
          } else if (u < cum[1]) {          // 周向结构环
            z = ((Math.floor(Math.random() * 11) / 10) * 2 - 1) * H * 0.97;
            var ang2 = Math.random() * Math.PI * 2;
            x = Math.cos(ang2) * rWall;
            y = Math.sin(ang2) * rWall;
            col = mixHex(0x6d8ba0, 0x30455a, Math.random());
            br = 0.92;
          } else if (u < cum[2]) {          // 城市地面（内壁环带）
            var ang3 = Math.random() * Math.PI * 2;
            var rg = cityR * (0.98 + Math.random() * 0.02);
            x = Math.cos(ang3) * rg;
            y = Math.sin(ang3) * rg;
            z = (Math.random() * 2 - 1) * H * 0.92;
            col = mixHex(0x3d6b39, 0x7c6b45, Math.random());
            br = 0.78;
          } else if (u < cum[3]) {          // 楼房轮廓（外表面优先，凸显形体）
            var bb = bld[(Math.random() * NB) | 0];
            var th0 = bb[0], rb2 = bb[1], rt2 = bb[2], bz2 = bb[3], z02 = bb[4], bw2 = bb[5];
            var rr, zz, dth;
            if (Math.random() < 0.62) {
              var face = (Math.random() * 5) | 0;
              if (face === 0) { rr = rt2; zz = z02 + (Math.random() * 2 - 1) * bz2; dth = (Math.random() * 2 - 1) * (bw2 / rb2); }
              else if (face === 1) { rr = rb2; zz = z02 + (Math.random() * 2 - 1) * bz2; dth = (Math.random() * 2 - 1) * (bw2 / rb2); }
              else if (face === 2) { rr = rt2 + Math.random() * (rb2 - rt2); zz = z02 + bz2; dth = (Math.random() * 2 - 1) * (bw2 / rb2); }
              else if (face === 3) { rr = rt2 + Math.random() * (rb2 - rt2); zz = z02 - bz2; dth = (Math.random() * 2 - 1) * (bw2 / rb2); }
              else { rr = rt2 + Math.random() * (rb2 - rt2); zz = z02 + (Math.random() * 2 - 1) * bz2; dth = (Math.random() < 0.5 ? -1 : 1) * (bw2 / rb2); }
            } else {
              rr = rt2 + Math.random() * (rb2 - rt2);
              zz = z02 + (Math.random() * 2 - 1) * bz2;
              dth = (Math.random() * 2 - 1) * (bw2 / rb2);
            }
            var bAng = th0 + dth;
            x = Math.cos(bAng) * rr;
            y = Math.sin(bAng) * rr;
            z = zz;
            col = mixHex(0x2b3541, 0x5a6674, Math.random());
            br = 0.55 + 0.9 * cityLight(z, SUNZ, H);
          } else if (u < cum[4]) {          // 楼房灯光（朝轴立面的暖光）
            var bb2 = bld[(Math.random() * NB) | 0];
            var th1 = bb2[0], rb3 = bb2[1], rt3 = bb2[2], bz3 = bb2[3], z03 = bb2[4], bw3 = bb2[5];
            var rr2 = rt3 + Math.random() * (rb3 - rt3) * 0.35;
            var zz2 = z03 + (Math.random() * 2 - 1) * bz3 * 0.95;
            var dth2 = (Math.random() * 2 - 1) * (bw3 / rb3) * 0.9;
            var bAng2 = th1 + dth2;
            x = Math.cos(bAng2) * rr2;
            y = Math.sin(bAng2) * rr2;
            z = zz2;
            col = mixHex(0xffe6a8, 0xff9a4a, Math.random());
            br = (0.9 + 0.9 * Math.random()) * (0.4 + 0.9 * cityLight(z, SUNZ, H));
          } else {                          // 三颗核聚变太阳（自发光）
            var si = (Math.random() * SUNZ.length) | 0;
            var sp = SUNC[si];
            var sr = 0.085 * R * Math.cbrt(Math.random());
            randDir(d);
            x = d[0] * sr;
            y = d[1] * sr;
            z = SUNZ[si] + d[2] * sr;
            col = mixHex(sp[0], sp[1], Math.random());
            br = 2.1;
          }
          P[i3] = x; P[i3 + 1] = y; P[i3 + 2] = z;
          C[i3] = col[0] * br; C[i3 + 1] = col[1] * br; C[i3 + 2] = col[2] * br;
        }
      }

      // ---- 宇航员：宇航服+透明头盔(露出写实人脸) · 肌肉 · 骨骼 · 内脏 ----
      // 身体用「半身高」为单位：脚底 y=−1，头顶 y=+1，面朝 +Z；R 为整体缩放
      function buildAstronaut(P, C, count, R, X) {
        var d = [0, 0, 0], o = [0, 0, 0];

        // 沿（近竖直）线段的广义圆柱采样，截面为椭圆 ex×ez，surf 为表面占比
        function segPt(ax, ay, az, bx, by, bz, ra, rb, ex, ez, surf) {
          var t = Math.random();
          var r = ra + (rb - ra) * t;
          var th = Math.random() * Math.PI * 2;
          var f = Math.random() < surf ? 1.0 : Math.sqrt(Math.random());
          o[0] = ax + (bx - ax) * t + Math.cos(th) * ex * r * f;
          o[1] = ay + (by - ay) * t;
          o[2] = az + (bz - az) * t + Math.sin(th) * ez * r * f;
        }
        // 椭球（surf 为表面占比）
        function ellPt(cx, cy, cz, rx, ry, rz, surf) {
          randDir(d);
          var f = Math.random() < surf ? 1.0 : Math.cbrt(Math.random());
          o[0] = cx + d[0] * rx * f;
          o[1] = cy + d[1] * ry * f;
          o[2] = cz + d[2] * rz * f;
        }
        // 盒（surf 为六面表面占比）
        function boxPt(cx, cy, cz, hx, hy, hz, surf) {
          if (Math.random() < surf) {
            var f = (Math.random() * 6) | 0;
            var u2 = Math.random() * 2 - 1, v2 = Math.random() * 2 - 1;
            if (f === 0) { o[0] = cx + hx; o[1] = cy + u2 * hy; o[2] = cz + v2 * hz; }
            else if (f === 1) { o[0] = cx - hx; o[1] = cy + u2 * hy; o[2] = cz + v2 * hz; }
            else if (f === 2) { o[0] = cx + u2 * hx; o[1] = cy + hy; o[2] = cz + v2 * hz; }
            else if (f === 3) { o[0] = cx + u2 * hx; o[1] = cy - hy; o[2] = cz + v2 * hz; }
            else if (f === 4) { o[0] = cx + u2 * hx; o[1] = cy + v2 * hy; o[2] = cz + hz; }
            else { o[0] = cx + u2 * hx; o[1] = cy + v2 * hy; o[2] = cz - hz; }
          } else {
            o[0] = cx + (Math.random() * 2 - 1) * hx;
            o[1] = cy + (Math.random() * 2 - 1) * hy;
            o[2] = cz + (Math.random() * 2 - 1) * hz;
          }
        }
        // 水平面内的椭圆环（肋骨 / 骨盆），tilt 让环前低后高
        function ribPt(yc, rx, rz, tilt) {
          var th = Math.random() * Math.PI * 2;
          var f = 0.90 + Math.random() * 0.10;
          var oz = Math.sin(th) * rz * f;
          o[0] = Math.cos(th) * rx * f;
          o[2] = oz;
          o[1] = yc - tilt * (oz / Math.max(rz, 1e-6)) + (Math.random() - 0.5) * 0.014;
        }

        // 顶层权重：宇航服 .50 | 头盔 .05 | 头部(写实) .07 | 肌肉 .15 | 骨骼 .12 | 内脏 .07 | 脂肪/软组织 .04
        for (var i = 0; i < count; i++) {
          var i3 = i * 3, u = Math.random();
          var col, br = 1.0;
          var sd = Math.random() < 0.5 ? -1 : 1;   // 左右对称采样

          if (u < 0.50) {
            // ==== 宇航服（贴合人体的写实外形）====
            var u2 = Math.random();
            if (u2 < 0.30) {                       // 躯干
              var r6 = Math.random();
              if (r6 < 0.35) segPt(0, 0.42, 0, 0, 0.60, 0, 0.150, 0.168, 1.0, 0.60, 0.97);
              else if (r6 < 0.72) segPt(0, 0.10, 0, 0, 0.42, 0, 0.112, 0.150, 1.0, 0.60, 0.97);
              else segPt(0, -0.22, 0, 0, 0.10, 0, 0.150, 0.112, 1.0, 0.62, 0.97);
              col = mixHex(0xf2f5f8, 0xc6d0d8, 0.25 + 0.50 * Math.random());
              if (o[2] > 0.085 && Math.abs(o[0]) < 0.06 && o[1] > 0.30) {   // 胸前控制面板
                col = mixHex(0x9fd8ff, 0x5f9fd0, Math.random());
                br = 1.15;
              }
            } else if (u2 < 0.34) {                // 领口环
              ellPt(0, 0.595, 0, 0.078, 0.045, 0.078, 0.85);
              col = mixHex(0x9fb0bc, 0x6a7a86, Math.random());
            } else if (u2 < 0.44) {                // 上臂 / 前臂 / 肘·腕关节
              var ac = Math.random();
              if (ac < 0.40) segPt(sd * 0.185, 0.54, 0, sd * 0.265, 0.25, 0.02, 0.048, 0.042, 1.0, 0.92, 0.97);
              else if (ac < 0.76) segPt(sd * 0.265, 0.25, 0.02, sd * 0.325, -0.05, 0.06, 0.040, 0.032, 1.0, 0.92, 0.97);
              else if (ac < 0.90) ellPt(sd * 0.265, 0.25, 0.02, 0.044, 0.044, 0.044, 0.85);   // 肘
              else ellPt(sd * 0.325, -0.05, 0.06, 0.034, 0.034, 0.034, 0.85);                 // 腕
              col = mixHex(0xeef1f4, 0xbac4cc, Math.random());
            } else if (u2 < 0.52) {                // 手套（手掌 + 五指）
              if (Math.random() < 0.35) {
                ellPt(sd * 0.335, -0.105, 0.085, 0.034, 0.052, 0.019, 0.85);
              } else {
                var fg = (Math.random() * 5) | 0;
                var spread = (fg - 2) * 0.016;
                var zoff = (fg - 2) * 0.004;
                segPt(sd * (0.335 + spread), -0.150, 0.085 + zoff,
                      sd * (0.345 + spread), -0.245 + Math.random() * 0.02, 0.09 + zoff,
                      0.011, 0.009, 1.0, 1.0, 0.92);
              }
              col = mixHex(0x6a747e, 0x454e56, Math.random());
            } else if (u2 < 0.74) {                // 大腿 / 小腿 / 髋·膝·踝关节
              var lc = Math.random();
              if (lc < 0.32) segPt(sd * 0.082, -0.17, 0, sd * 0.098, -0.50, 0.01, 0.076, 0.054, 1.0, 0.95, 0.97);
              else if (lc < 0.58) segPt(sd * 0.098, -0.50, 0.01, sd * 0.108, -0.87, 0.0, 0.054, 0.038, 1.0, 0.92, 0.97);
              else if (lc < 0.74) ellPt(sd * 0.082, -0.17, 0, 0.074, 0.070, 0.070, 0.85);      // 髋
              else if (lc < 0.88) ellPt(sd * 0.098, -0.50, 0.012, 0.056, 0.054, 0.054, 0.85); // 膝
              else ellPt(sd * 0.108, -0.88, 0.0, 0.040, 0.044, 0.040, 0.85);                  // 踝
              col = mixHex(0xf0f3f6, 0xc4ced6, Math.random());
            } else if (u2 < 0.82) {                // 靴子（上缘包住踝部，与小腿相连）
              boxPt(sd * 0.112, -0.915, 0.05, 0.052, 0.070, 0.112, 0.85);
              col = mixHex(0x8a949e, 0x555e66, Math.random());
            } else if (u2 < 0.92) {                // 生命保障背包
              boxPt(0, 0.20, -0.155, 0.125, 0.27, 0.075, 0.70);
              col = mixHex(0xd8dde2, 0x98a2aa, Math.random());
            } else {                               // 肩甲
              ellPt(sd * 0.185, 0.55, 0, 0.066, 0.062, 0.058, 0.95);
              col = mixHex(0xdde3e8, 0xaab4bc, Math.random());
            }
          } else if (u < 0.55) {
            // ==== 头盔：后/顶/两侧为壳，正面留出透明面窗露出真人脸 ====
            var u2b = Math.random();
            if (u2b < 0.85) {
              for (var htry0 = 0; htry0 < 10; htry0++) {
                ellPt(0, 0.79, 0.01, 0.185, 0.195, 0.195, 0.95);
                if (!(o[2] > 0.075 && Math.abs(o[0]) < 0.098 && o[1] > 0.700 && o[1] < 0.900)) break;
              }
              col = mixHex(0xdfeaf2, 0xb4c8d6, Math.random());
              br = 0.85;
            } else {                               // 面窗金属边框
              var ph = Math.random() * Math.PI * 2;
              ellPt(Math.cos(ph) * 0.105, 0.80 + Math.sin(ph) * 0.105, 0.135, 0.016, 0.016, 0.012, 0.90);
              col = mixHex(0x9fb0bc, 0x60707c, Math.random());
            }
          } else if (u < 0.62) {
            // ==== 头部（写实真人：皮肤 / 毛发 / 五官）====
            var h6 = Math.random();
            var skinC = mixHex(0xecb894, 0xd39c74, 0.15 + 0.40 * Math.random());
            if (h6 < 0.05) {                       // 颈
              segPt(0, 0.60, 0, 0, 0.74, 0, 0.052, 0.046, 1.0, 0.90, 0.90);
              col = mixHex(0xe6b088, 0xc8926a, Math.random());
            } else if (h6 < 0.60) {                // 头颅
              ellPt(0, 0.82, 0.005, 0.118, 0.126, 0.126, 0.92);
              col = skinC;
            } else if (h6 < 0.79) {                // 下颌 / 下巴
              ellPt(0, 0.705, 0.03, 0.086, 0.072, 0.092, 0.92);
              col = skinC;
            } else if (h6 < 0.87) {                // 鼻
              ellPt(0, 0.792, 0.120, 0.020, 0.032, 0.026, 0.95);
              col = skinC;
            } else if (h6 < 0.91) {                // 耳
              ellPt(sd * 0.120, 0.805, 0.0, 0.013, 0.028, 0.020, 0.92);
              col = skinC;
            } else if (h6 < 0.95) {                // 颧 / 颊
              ellPt(sd * 0.070, 0.760, 0.085, 0.035, 0.030, 0.030, 0.85);
              col = skinC;
            } else if (h6 < 0.98) {                // 头发（露出额头）
              for (var htry2 = 0; htry2 < 8; htry2++) {
                ellPt(0, 0.83, 0.005, 0.132, 0.140, 0.136, 0.95);
                if (!(o[2] > 0.045 && o[1] < 0.905 && o[1] > 0.695)) break;
              }
              col = mixHex(0x3a2a20, 0x1d150f, Math.random());
            } else {                               // 五官：眼白 / 瞳孔 / 眉 / 唇
              var u22 = Math.random();
              if (u22 < 0.42) {
                ellPt(sd * 0.047, 0.815, 0.118, 0.023, 0.014, 0.011, 1.0);
                col = mixHex(0xf2eee8, 0xdcd6cc, Math.random());
                br = 0.75;
              } else if (u22 < 0.66) {
                ellPt(sd * 0.047, 0.815, 0.128, 0.009, 0.010, 0.007, 1.0);
                col = mixHex(0x2b2b38, 0x14141c, Math.random());
              } else if (u22 < 0.84) {
                ellPt(sd * 0.048, 0.847, 0.116, 0.028, 0.007, 0.009, 1.0);
                col = mixHex(0x2a2018, 0x181009, Math.random());
              } else {
                ellPt(0, 0.735, 0.118, 0.036, 0.010, 0.013, 1.0);
                col = mixHex(0xc06a6a, 0x984848, Math.random());
              }
