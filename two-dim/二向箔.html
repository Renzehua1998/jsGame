<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>二向箔 · 展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: "Microsoft YaHei", Consolas, monospace;
    color: #cfe8ff;
    background: radial-gradient(circle at 50% 46%, #05080f 0%, #000 68%);
    cursor: grab; user-select: none;
    touch-action: none;
  }
  body.grabbing { cursor: grabbing; }
  #bg { position: fixed; inset: 0; display: block; }

  .halo {
    position: fixed; left: 50%; top: 46%; width: 540px; height: 540px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(120,170,245,0.28) 0%, rgba(70,120,220,0.10) 42%, transparent 72%);
    filter: blur(6px); pointer-events: none;
    animation: breathe 4.5s ease-in-out infinite;
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1400px; perspective-origin: 50% 46%;
  }
  .view { transform-style: preserve-3d; }
  .zoom { transform-style: preserve-3d; transform: scale(1); transition: transform 0.12s ease-out; }
  .spin { transform-style: preserve-3d; animation: spinY 14s linear infinite; }
  .flip { transform-style: preserve-3d; animation: flipX 8.5s ease-in-out infinite; }

  .foil {
    position: relative; width: 300px; height: 82px; border-radius: 9px;
    transform-style: preserve-3d;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 11px),
      linear-gradient(135deg, #ffffff 0%, #dbe9fa 22%, #9dbde0 48%, #f3f9ff 70%, #b6cde6 100%);
    box-shadow:
      0 0 18px 3px rgba(190,222,255,0.95),
      0 0 55px 14px rgba(120,170,245,0.65),
      0 0 140px 46px rgba(70,120,220,0.38);
    animation: halo 3.4s ease-in-out infinite;
  }
  /* 极细的边缘高光：翻转成侧面时看起来就是一条发光的线 */
  .foil::after {
    content: ""; position: absolute; inset: -1px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 12px rgba(200,230,255,0.9);
    pointer-events: none;
  }
  .foil .sheen { position: absolute; inset: 0; border-radius: 9px; overflow: hidden; }
  .foil .sheen::before {
    content: ""; position: absolute; top: -60%; left: -45%; width: 45%; height: 220%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    transform: rotate(18deg);
    animation: sheen 3.8s ease-in-out infinite;
  }

  .title {
    position: fixed; left: 0; right: 0; top: 9%; text-align: center;
    font-size: 30px; letter-spacing: 14px; color: #eaf4ff;
    text-shadow: 0 0 18px rgba(150,200,255,0.9), 0 0 40px rgba(90,150,240,0.6);
    pointer-events: none; user-select: none;
  }
  .sub {
    position: fixed; left: 0; right: 0; top: calc(9% + 48px); text-align: center;
    font-size: 13px; letter-spacing: 3px; color: #7fa6d0;
    text-shadow: 0 0 10px rgba(90,140,220,0.6); pointer-events: none; user-select: none;
  }
  .back {
    position: fixed; left: 16px; bottom: 16px; z-index: 5;
    font-size: 12px; letter-spacing: 1px; text-decoration: none;
    color: #9fc4e8; border: 1px solid rgba(90,140,190,0.35);
    background: rgba(12,26,44,0.55); padding: 6px 12px; border-radius: 2px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .back:hover { background: rgba(30,60,100,0.7); color: #e0f2ff; }

  @keyframes spinY { from { transform: rotateY(0deg); } to { transform: rotateY(1080deg); } }
  @keyframes flipX {
    0%   { transform: rotateX(14deg) rotateZ(0deg); }
    50%  { transform: rotateX(346deg) rotateZ(10deg); }
    100% { transform: rotateX(374deg) rotateZ(0deg); }
  }
  @keyframes halo {
    0%, 100% {
      box-shadow: 0 0 18px 3px rgba(190,222,255,0.95),
                  0 0 55px 14px rgba(120,170,245,0.65),
                  0 0 140px 46px rgba(70,120,220,0.38);
    }
    50% {
      box-shadow: 0 0 26px 6px rgba(210,235,255,1),
                  0 0 80px 22px rgba(140,185,250,0.8),
                  0 0 190px 64px rgba(90,140,235,0.5);
    }
  }
  @keyframes sheen { 0% { left: -45%; } 55% { left: 108%; } 100% { left: 108%; } }
  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="halo"></div>
  <div class="stage">
    <div class="view">
      <div class="zoom">
        <div class="spin">
          <div class="flip">
            <div class="foil"><span class="sheen"></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="title">二 向 箔</div>
  <div class="sub">一张正在翻转的二维薄片 · 拖动旋转视角 · 滚轮缩放 · 双击复位</div>
  <a class="back" href="index.html">« 返回二维化模拟</a>

  <script>
    (function () {
      var cv = document.getElementById("bg"), ctx = cv.getContext("2d"), stars = [];
      function resize() {
        cv.width = innerWidth; cv.height = innerHeight;
        var n = Math.round(innerWidth * innerHeight / 4200);
        stars = [];
        for (var i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * cv.width,
            y: Math.random() * cv.height,
            r: Math.random() * 1.3 + 0.2,
            a: Math.random() * 0.7 + 0.15
          });
        }
        draw();
      }
      function draw() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = "#dbeaff";
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          ctx.globalAlpha = s.a;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      addEventListener("resize", resize);
      resize();

      // ---- 拖动旋转视角（与主界面一致的手感）----
      var viewEl = document.querySelector(".view");
      var yaw = 0, pitch = 0, drag = null;
      function applyView() {
        viewEl.style.transform = "rotateX(" + pitch + "deg) rotateY(" + yaw + "deg)";
      }
      function startDrag(x, y) { drag = { x: x, y: y, yaw: yaw, pitch: pitch }; }
      function moveDrag(x, y) {
        if (!drag) return;
        yaw = drag.yaw + (x - drag.x) * 0.4;
        pitch = Math.max(-85, Math.min(85, drag.pitch + (y - drag.y) * 0.35));
        applyView();
      }
      addEventListener("mousedown", function (e) {
        if (e.target && e.target.closest && e.target.closest("a")) return;
        startDrag(e.clientX, e.clientY);
        document.body.classList.add("grabbing");
      });
      addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
      addEventListener("mouseup", function () { drag = null; document.body.classList.remove("grabbing"); });

      // ---- 缩放：滚轮 / 双指捏合；双击复位 ----
      var zoomEl = document.querySelector(".zoom");
      var scale = 1, MIN = 0.35, MAX = 3.5;
      function setScale(s) {
        scale = Math.max(MIN, Math.min(MAX, s));
        zoomEl.style.transform = "scale(" + scale + ")";
      }
      addEventListener("wheel", function (e) {
        e.preventDefault();
        setScale(scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
      }, { passive: false });
      addEventListener("dblclick", function () { setScale(1); });

      var pinch = null;
      function pinchDist(t) {
        var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      addEventListener("touchstart", function (e) {
        if (e.touches.length === 2) { pinch = { d: pinchDist(e.touches), s: scale }; drag = null; }
        else if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); }
      }, { passive: true });
      addEventListener("touchmove", function (e) {
        if (e.touches.length === 2 && pinch) {
          e.preventDefault();
          setScale(pinch.s * (pinchDist(e.touches) / pinch.d));
        } else if (e.touches.length === 1 && drag) {
          e.preventDefault();
          moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });
      addEventListener("touchend", function () { pinch = null; drag = null; });
    })();
  </script>
</body>
</html>
